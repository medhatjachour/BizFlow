name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel a running deploy; queue instead

jobs:
  # ── 1) Build & validate ───────────────────────────────────────────────────
  build:
    name: Build & lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      - name: Install website deps
        working-directory: apps/website
        run: npm ci --workspaces=false --legacy-peer-deps

      - name: Generate Prisma client
        working-directory: apps/website
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Lint
        working-directory: apps/website
        run: npm run lint

      - name: Test
        working-directory: apps/website
        env:
          # Suites exercise registration, ticket lookup and the download route
          # against a throwaway SQLite file, so they need the schema pushed first.
          WEBSITE_DATABASE_URL: file:${{ runner.temp }}/ci-website-test.db
        run: |
          npx prisma db push --schema=prisma/schema.prisma --skip-generate --accept-data-loss
          npx vitest run

      - name: Build website (with build-time placeholder secrets)
        working-directory: apps/website
        env:
          # `lib/admin.ts` and `lib/license.ts` deliberately throw when these are
          # unset while NODE_ENV=production, which `next build` sets. The Dockerfile
          # passes the same placeholders. None of this is used at runtime - the real
          # values come from the server's .env.
          ADMIN_PASSWORD: build-validation-only
          LICENSE_SECRET: build-validation-only
          NEXT_PUBLIC_BASE_PATH: ""
          # Must be the canonical, DNS-resolvable host (the bare `bizflow.` subdomain
          # has no A record).
          NEXT_PUBLIC_SITE_URL: https://www.bizflow.medhatjachour.tech
        run: npm run build

  # ── 2) Deploy to VPS ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    # The VPS now builds both apps from their own lock files in both stages, so the
    # first build after this change cannot reuse cached layers. 30 minutes was too
    # tight for that cold run.
    #
    # The sync is fast again (a single tar stream rather than ~1,800 per-file scp
    # round trips), but the docker build on the VPS legitimately takes 20-30+ minutes
    # with cold layers. At 45 minutes a cold deploy was killed mid-build - worse than
    # a slow one, because the run then reports a timeout with nothing to roll back.
    timeout-minutes: 90
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Add VPS host key
        run: |
          mkdir -p ~/.ssh
          # `ssh-keyscan` has no retry and its failure aborts the entire deploy
          # before anything happens (observed as a transient failure that skipped
          # every later step). Retry, then fall back to trust-on-first-use for
          # this run so a flaky keyscan cannot block a deploy.
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -H 168.231.107.207 >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "captured the host key on attempt $attempt"
              exit 0
            fi
            echo "ssh-keyscan attempt $attempt failed; retrying in 5s"
            sleep 5
          done
          echo "WARNING: could not capture the host key after 5 attempts."
          echo "Falling back to StrictHostKeyChecking=accept-new for this run."
          printf 'Host 168.231.107.207\n  StrictHostKeyChecking accept-new\n' >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Write deploy SSH key
        run: |
          echo "${{ secrets.VPS_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # Ship the complete tracked tree.
      #
      # This used to sync an allow-list (`PATHS=(...)`), and the list drifted the
      # way allow-lists do: 75 tracked files were never synced, including the whole
      # top-level apps/website/src/app (the landing page, /account, /app,
      # /download, /legal, /status, /support, robots.ts, manifest.ts,
      # opengraph-image.tsx, globals.css), src/proxy.ts, prisma/schema.prisma and
      # its migrations, public/, next.config.ts and every config file. The VPS then
      # rebuilt current components and lib code against an original-clone landing
      # page and account dashboard, so `<section id="included">` and the rebuilt
      # /account never reached production even though every deploy was green - the
      # smoke test only ever looked at status codes.
      #
      # `git archive HEAD` cannot drift: it emits exactly what is committed. Build
      # output, secrets and databases are untracked, so none of them can leak into
      # the payload either, which is why no excludes are needed.
      #
      # NOTE: the root-domain static site is NOT synced here. It is built from the
      # separate portfolio repository and lives in ./portfolio-dist on the host,
      # which nginx bind-mounts (see docker-compose.yml).
      - name: Sync files to VPS
        run: |
          # A pipeline's exit status is normally that of its last command, so a
          # failing `git archive` would leave this step reporting success after
          # syncing nothing, and the build below would then deploy the previous
          # sources. Surface it instead.
          set -o pipefail

          REMOTE="medhat@168.231.107.207"
          BASE="/tmp/bizflow-ci-deploy"
          # Fail fast instead of hanging for hours if the link to the VPS stalls.
          SSH="ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8"

          # Archive the commit this run is deploying, not whatever the checkout
          # happens to hold.
          head=$(git rev-parse HEAD)
          if [ "$head" != "${{ github.sha }}" ]; then
            echo "::error::Checked out $head but this run deploys ${{ github.sha }}"
            exit 1
          fi

          # Start from an empty stage: the count check below must measure this
          # payload, not leftovers from an earlier run.
          $SSH $REMOTE "rm -rf $BASE && mkdir -p $BASE"

          # One compressed stream. The per-file `scp -r` this replaced needed a
          # round trip per file and took ~21 minutes for ~1,900 files; a single
          # stream moves the same tree in seconds.
          git archive --format=tar HEAD | gzip -6 | $SSH $REMOTE "tar -xzf - -C $BASE"

          # Completeness guard. The stale-source bug stayed invisible for so long
          # because nothing compared what was sent with what was committed: a
          # partial payload silently left older files in place for `cp -a` to keep.
          expected=$(git ls-files | wc -l)
          actual=$($SSH $REMOTE "find $BASE -type f | wc -l")
          echo "Synced $actual of $expected tracked files to $BASE"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Incomplete deploy payload: $actual of $expected tracked files reached $BASE"
            exit 1
          fi

      # The remote body is a tracked script read from stdin, not a double-quoted
      # argument to ssh.
      #
      # The inline form was a live bug rather than a style preference: bash
      # expands backticks inside double quotes on the machine running the
      # workflow, so the two backticks in that body's prose comments - around
      # "cp -a" and around "env" - were executed on the runner before ssh ever
      # saw the string. The second one, the bare word env, spliced the runner's
      # entire environment (secrets included) into the remote script, where those
      # lines sit outside any comment; bash on the VPS then exited 127 with
      # "command not found" before reaching the data backup or the image tag, and
      # the failure said "bash: line 25" - a line number that belonged to nothing.
      # Piping a file keeps the runner from parsing a single byte of the script,
      # removes the need for the \$VAR and \" escaping the remote body used, and
      # makes any future failure name scripts/apply-deploy.sh with a line number.
      - name: Apply & rebuild on VPS
        id: apply
        run: |
          # Keep the session alive across the multi-minute docker build so a slow but
          # healthy build is not dropped half way through.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            medhat@168.231.107.207 "bash -s -- '${{ github.sha }}'" \
            < scripts/apply-deploy.sh

      - name: Smoke test
        id: smoke
        run: |
          # Use the canonical, DNS-resolvable hostname. The bare
          # `bizflow.medhatjachour.tech` has no A record and always fails.
          BASE="https://www.bizflow.medhatjachour.tech"
          ROOT="https://medhatjachour.tech"
          check() { code=$(curl -s -o /dev/null -w "%{http_code}" "$1"); echo "$2=$code"; [ "$code" = "200" ]; }
          # Asserts an exact status code (used to prove the root web root is populated:
          # an empty/missing web root yields 403 for "/" and 500 for missing files).
          expect() { code=$(curl -s -o /dev/null -w "%{http_code}" "$1"); echo "$2=$code"; [ "$code" = "$3" ]; }
          check "$BASE"                      HOME
          check "$BASE/robots.txt"           ROBOTS
          check "$BASE/sitemap.xml"          SITEMAP
          check "$BASE/admin/login"          ADMIN_LOGIN
          check "$BASE/portal/login"         PORTAL_LOGIN
          check "$BASE/api/prices"           PRICES_API
          check "$BASE/api/version"          VERSION_API
          check "$ROOT/"                     ROOT_HOME
          check "$ROOT/favicon.ico"          ROOT_FAVICON
          check "$ROOT/profile.png"          ROOT_PROFILE
          # Missing hashed assets must return 404, not the SPA fallback HTML.
          expect "$ROOT/assets/does-not-exist.js" ROOT_ASSET_404 404

          # A 200 is not evidence of freshness. The deploy that shipped a landing
          # page missing its newest section answered every one of the checks above
          # correctly, because the image had been rebuilt from stale sources. So
          # require the running build to name the commit that was pushed: the value
          # is inlined at image build time from the BUILD_COMMIT build arg, which
          # makes it a property of the build rather than of the environment the
          # container was started in, and therefore something an old image cannot
          # claim.
          running=$(curl -s "$BASE/api/version" | tr -d ' ' | grep -o '"commit":"[^"]*"' | cut -d: -f2 | tr -d '"')
          echo "RUNNING_COMMIT=$running"
          if [ "$running" != "${{ github.sha }}" ]; then
            echo "::error::The deployed container reports commit '$running' but this run deploys '${{ github.sha }}' - the image was not built from this commit"
            exit 1
          fi

      # Safety net: if the deploy happened but verification failed, put the
      # previous image back. Guarded on the apply step so a failure during
      # checkout/sync (when nothing was deployed) does not cause a needless
      # rollback. The database is untouched by this - it was backed up in the
      # apply step and can be restored with scripts/restore-data.sh.
      - name: Roll back to the previous image
        if: failure() && steps.apply.outcome == 'success'
        run: |
          echo 'Verification failed after deploying - rolling back.'
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes medhat@168.231.107.207 'bash -s' \
            < scripts/rollback-deploy.sh
          echo 'Rolled back. Investigate the failed run before retrying.'

      - name: Cleanup temp deploy dir
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes medhat@168.231.107.207 \
            "rm -rf /tmp/bizflow-ci-deploy" || true
