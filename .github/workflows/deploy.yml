name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel a running deploy; queue instead

jobs:
  # ── 1) Build & validate ───────────────────────────────────────────────────
  build:
    name: Build & lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      - name: Install website deps
        working-directory: apps/website
        run: npm ci --workspaces=false --legacy-peer-deps

      - name: Generate Prisma client
        working-directory: apps/website
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Lint
        working-directory: apps/website
        run: npm run lint

      - name: Test
        working-directory: apps/website
        env:
          # Suites exercise registration, ticket lookup and the download route
          # against a throwaway SQLite file, so they need the schema pushed first.
          WEBSITE_DATABASE_URL: file:${{ runner.temp }}/ci-website-test.db
        run: |
          npx prisma db push --schema=prisma/schema.prisma --skip-generate --accept-data-loss
          npx vitest run

      - name: Build website (with build-time placeholder secrets)
        working-directory: apps/website
        env:
          # `lib/admin.ts` and `lib/license.ts` deliberately throw when these are
          # unset while NODE_ENV=production, which `next build` sets. The Dockerfile
          # passes the same placeholders. None of this is used at runtime - the real
          # values come from the server's .env.
          ADMIN_PASSWORD: build-validation-only
          LICENSE_SECRET: build-validation-only
          NEXT_PUBLIC_BASE_PATH: ""
          # Must be the canonical, DNS-resolvable host (the bare `bizflow.` subdomain
          # has no A record).
          NEXT_PUBLIC_SITE_URL: https://www.bizflow.medhatjachour.tech
        run: npm run build

  # ── 2) Deploy to VPS ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    # The VPS now builds both apps from their own lock files in both stages, so the
    # first build after this change cannot reuse cached layers. 30 minutes was too
    # tight for that cold run.
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Add VPS host key
        run: |
          mkdir -p ~/.ssh
          # `ssh-keyscan` has no retry and its failure aborts the entire deploy
          # before anything happens (observed as a transient failure that skipped
          # every later step). Retry, then fall back to trust-on-first-use for
          # this run so a flaky keyscan cannot block a deploy.
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -H 168.231.107.207 >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "captured the host key on attempt $attempt"
              exit 0
            fi
            echo "ssh-keyscan attempt $attempt failed; retrying in 5s"
            sleep 5
          done
          echo "WARNING: could not capture the host key after 5 attempts."
          echo "Falling back to StrictHostKeyChecking=accept-new for this run."
          printf 'Host 168.231.107.207\n  StrictHostKeyChecking accept-new\n' >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Write deploy SSH key
        run: |
          echo "${{ secrets.VPS_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # Push only the app source files (not test artifacts)
      - name: Sync files to VPS
        run: |
          REMOTE="medhat@168.231.107.207"
          BASE="/tmp/bizflow-ci-deploy"
          SSH="ssh -i ~/.ssh/deploy_key -o BatchMode=yes"

          $SSH $REMOTE "
            mkdir -p \
              $BASE/apps/Bizflow \
              $BASE/apps/website/src/app/admin/login \
              $BASE/apps/website/src/app/api/admin \
              $BASE/apps/website/src/app/api/portal/login \
              $BASE/apps/website/src/app/api/requests \
              $BASE/apps/website/src/app/api/webhooks/stripe \
              $BASE/apps/website/src/app/checkout/success \
              $BASE/apps/website/src/app/plugins \
              $BASE/apps/website/src/app/portal/login \
              $BASE/apps/website/src/components/admin \
              $BASE/apps/website/src/components/landing \
              $BASE/apps/website/src/components/portal \
              $BASE/apps/website/src/lib \
              $BASE/docs \
              $BASE/scripts \
              $BASE/.github/workflows
          "

          SCP="scp -i ~/.ssh/deploy_key -q"

          # Root infra
          # NOTE: the root-domain static site is NOT synced here. It is built from
          # the separate portfolio repository and lives in ./portfolio-dist on the
          # host, which nginx bind-mounts (see docker-compose.yml).
          # The root manifests and .dockerignore MUST be synced: the container build
          # installs from them, and a stale root package.json (which used to declare
          # npm `workspaces`) made the VPS build context differ from the repo.
          $SCP Dockerfile docker-compose.yml nginx.conf \
               package.json package-lock.json .dockerignore $REMOTE:$BASE/

          # BizFlow bridge, web UI, schemas, and build configuration
          $SCP -r apps/Bizflow $REMOTE:$BASE/apps/

          # Website source
          $SCP -r apps/website/src/app/admin        $REMOTE:$BASE/apps/website/src/app/
          $SCP -r apps/website/src/app/api          $REMOTE:$BASE/apps/website/src/app/
          $SCP -r apps/website/src/app/plugins      $REMOTE:$BASE/apps/website/src/app/
          $SCP -r apps/website/src/app/portal       $REMOTE:$BASE/apps/website/src/app/
          $SCP -r apps/website/src/app/checkout     $REMOTE:$BASE/apps/website/src/app/
          $SCP apps/website/src/app/layout.tsx      $REMOTE:$BASE/apps/website/src/app/
          $SCP apps/website/src/app/sitemap.ts      $REMOTE:$BASE/apps/website/src/app/
          $SCP -r apps/website/src/components       $REMOTE:$BASE/apps/website/src/
          $SCP -r apps/website/src/lib              $REMOTE:$BASE/apps/website/src/
          $SCP apps/website/package.json apps/website/package-lock.json \
               $REMOTE:$BASE/apps/website/

          # Scripts & docs
          $SCP -r scripts $REMOTE:$BASE/
          $SCP docs/DOWNLOAD_FLOW_AND_RELEASES.md $REMOTE:$BASE/docs/
          $SCP .github/workflows/trivy-container.yml $REMOTE:$BASE/.github/workflows/

      - name: Apply & rebuild on VPS
        id: apply
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes medhat@168.231.107.207 "
            set -e
            cd /home/medhat/bizflow
            cp -a /tmp/bizflow-ci-deploy/. .

            echo '--- pre-deploy data backup ---'
            # Fail-safe: refuse to deploy without a restore point. If this breaks,
            # fix backups rather than shipping without one.
            bash scripts/backup-data.sh

            echo '--- tag the current image so we can roll back ---'
            if docker image inspect bizflow-bizflow-app:latest >/dev/null 2>&1; then
              docker tag bizflow-bizflow-app:latest bizflow-bizflow-app:previous
              echo 'tagged bizflow-bizflow-app:previous'
            else
              echo 'no existing image to tag (first deploy?)'
            fi

            docker compose config --quiet
            docker compose up -d --build
            echo 'Waiting for healthy...'
            for i in \$(seq 1 24); do
              s=\$(docker inspect -f '{{.State.Health.Status}}' bizflow-app 2>/dev/null || echo starting)
              [ \"\$s\" = 'healthy' ] && break
              sleep 5
            done
            docker inspect -f 'STATUS={{.State.Health.Status}}' bizflow-app
          "

      - name: Smoke test
        id: smoke
        run: |
          # Use the canonical, DNS-resolvable hostname. The bare
          # `bizflow.medhatjachour.tech` has no A record and always fails.
          BASE="https://www.bizflow.medhatjachour.tech"
          ROOT="https://medhatjachour.tech"
          check() { code=$(curl -s -o /dev/null -w "%{http_code}" "$1"); echo "$2=$code"; [ "$code" = "200" ]; }
          # Asserts an exact status code (used to prove the root web root is populated:
          # an empty/missing web root yields 403 for "/" and 500 for missing files).
          expect() { code=$(curl -s -o /dev/null -w "%{http_code}" "$1"); echo "$2=$code"; [ "$code" = "$3" ]; }
          check "$BASE"                      HOME
          check "$BASE/robots.txt"           ROBOTS
          check "$BASE/sitemap.xml"          SITEMAP
          check "$BASE/admin/login"          ADMIN_LOGIN
          check "$BASE/portal/login"         PORTAL_LOGIN
          check "$BASE/api/prices"           PRICES_API
          check "$ROOT/"                     ROOT_HOME
          check "$ROOT/favicon.ico"          ROOT_FAVICON
          check "$ROOT/profile.png"          ROOT_PROFILE
          # Missing hashed assets must return 404, not the SPA fallback HTML.
          expect "$ROOT/assets/does-not-exist.js" ROOT_ASSET_404 404

      # Safety net: if the deploy happened but verification failed, put the
      # previous image back. Guarded on the apply step so a failure during
      # checkout/sync (when nothing was deployed) does not cause a needless
      # rollback. The database is untouched by this - it was backed up in the
      # apply step and can be restored with scripts/restore-data.sh.
      - name: Roll back to the previous image
        if: failure() && steps.apply.outcome == 'success'
        run: |
          echo 'Verification failed after deploying - rolling back.'
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes medhat@168.231.107.207 "
            cd /home/medhat/bizflow
            if ! docker image inspect bizflow-bizflow-app:previous >/dev/null 2>&1; then
              echo 'no previous image available; cannot roll back'
              exit 0
            fi
            docker tag bizflow-bizflow-app:previous bizflow-bizflow-app:latest
            docker compose up -d --no-build --force-recreate bizflow-app
            for i in \$(seq 1 24); do
              s=\$(docker inspect -f '{{.State.Health.Status}}' bizflow-app 2>/dev/null || echo starting)
              [ \"\$s\" = 'healthy' ] && break
              sleep 5
            done
            docker inspect -f 'ROLLBACK_STATUS={{.State.Health.Status}}' bizflow-app
          "
          echo 'Rolled back. Investigate the failed run before retrying.'

      - name: Cleanup temp deploy dir
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes medhat@168.231.107.207 \
            "rm -rf /tmp/bizflow-ci-deploy" || true
