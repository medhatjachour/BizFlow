name: Publish Desktop Installers

on:
  push:
    branches:
      - main
    paths:
      - "apps/Bizflow/**"
      - ".github/workflows/publish-commerce-installers.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-desktop-installers
  # Every push to main used to cancel the run in flight. Because the mac matrix
  # builds ten modules one at a time (max-parallel: 1) and waits on windows
  # first, the run never survived long enough to finish - which is why the
  # history is mostly cancelled. Queue instead of cancelling.
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        module:
          - suite
          - commerce
          - bakery
          - restaurant
          - coffee
          - warehouse
          - clinic
          - vet
          - pharmacy
          - gym
    defaults:
      run:
        working-directory: apps/Bizflow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/Bizflow/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build app (commerce)
        run: npm run build
        env:
          ENABLED_MODULES: ${{ matrix.module }}

      - name: Package Windows installer
        run: npx cross-env ENABLED_MODULES=${{ matrix.module }} CSC_IDENTITY_AUTO_DISCOVERY=false electron-builder --win --x64 --publish never

      - name: Prepare release asset name
        shell: pwsh
        run: |
          $module = "${{ matrix.module }}"
          $slug = switch ($module) {
            "suite" { "Suite" }
            "commerce" { "Commerce" }
            "bakery" { "Bakery" }
            "restaurant" { "Restaurant" }
            "coffee" { "Coffee" }
            "warehouse" { "Warehouse" }
            "clinic" { "Clinic" }
            "vet" { "VetClinic" }
            "pharmacy" { "Pharmacy" }
            "gym" { "Gym" }
            default { (Get-Culture).TextInfo.ToTitleCase($module) }
          }
          $source = Get-ChildItem dist -Filter *.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $source) { throw "No .exe installer found in dist" }
          $target = "dist/BizFlow-$slug-windows.exe"
          Copy-Item $source.FullName $target -Force
          "ASSET_PATH=$target" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish Windows asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: downloads-latest
          name: BizFlow Downloads
          prerelease: false
          make_latest: true
          files: |
            apps/Bizflow/${{ env.ASSET_PATH }}

  mac:
    runs-on: macos-latest
    needs: windows
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        module:
          - suite
          - commerce
          - bakery
          - restaurant
          - coffee
          - warehouse
          - clinic
          - vet
          - pharmacy
          - gym
    defaults:
      run:
        working-directory: apps/Bizflow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/Bizflow/package-lock.json

      # Every macOS matrix job failed on this step while the identical command
      # passed on Windows and Linux. GitHub does not serve Actions logs without
      # repo access, so this step is written to be both resilient and
      # self-explaining: it retries with a plain install, and dumps the npm
      # debug log so the next failure names its own cause instead of hiding it.
      - name: Install dependencies
        shell: bash
        run: |
          echo "node=$(node --version) npm=$(npm --version)"
          echo "platform=$(uname -s) arch=$(uname -m)"
          df -h . | tail -n 1

          if npm ci --ignore-scripts --no-audit --no-fund; then
            echo "npm ci completed"
            exit 0
          fi

          echo "::warning::npm ci failed - collecting diagnostics and retrying with npm install"
          npm config get registry || true
          npm ping || true
          ls -la "$HOME/.npm/_logs" 2>/dev/null || true
          for f in "$HOME"/.npm/_logs/*debug-0.log; do
            [ -f "$f" ] || continue
            echo "----- $f (last 60 lines) -----"
            tail -n 60 "$f"
          done

          npm install --ignore-scripts --no-audit --no-fund

      - name: Build app (commerce)
        run: npm run build
        env:
          ENABLED_MODULES: ${{ matrix.module }}

      - name: Package macOS DMG
        run: npx cross-env ENABLED_MODULES=${{ matrix.module }} electron-builder --mac dmg --publish never

      - name: Prepare release asset name
        run: |
          module="${{ matrix.module }}"
          case "$module" in
            suite) slug="Suite" ;;
            commerce) slug="Commerce" ;;
            bakery) slug="Bakery" ;;
            restaurant) slug="Restaurant" ;;
            coffee) slug="Coffee" ;;
            warehouse) slug="Warehouse" ;;
            clinic) slug="Clinic" ;;
            vet) slug="VetClinic" ;;
            pharmacy) slug="Pharmacy" ;;
            gym) slug="Gym" ;;
            *) slug="${module^}" ;;
          esac
          source="$(ls -t dist/*.dmg | head -n1)"
          test -n "$source"
          target="dist/BizFlow-${slug}-mac.dmg"
          cp "$source" "$target"
          echo "ASSET_PATH=$target" >> "$GITHUB_ENV"

      - name: Publish macOS asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: downloads-latest
          name: BizFlow Downloads
          prerelease: false
          make_latest: true
          files: |
            apps/Bizflow/${{ env.ASSET_PATH }}

  linux:
    runs-on: ubuntu-latest
    needs: mac
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        module:
          - suite
          - commerce
          - bakery
          - restaurant
          - coffee
          - warehouse
          - clinic
          - vet
          - pharmacy
          - gym
    defaults:
      run:
        working-directory: apps/Bizflow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/Bizflow/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build app (commerce)
        run: npm run build
        env:
          ENABLED_MODULES: ${{ matrix.module }}

      - name: Package Linux AppImage
        run: npx cross-env ENABLED_MODULES=${{ matrix.module }} electron-builder --linux AppImage --publish never

      - name: Prepare release asset name
        run: |
          module="${{ matrix.module }}"
          case "$module" in
            suite) slug="Suite" ;;
            commerce) slug="Commerce" ;;
            bakery) slug="Bakery" ;;
            restaurant) slug="Restaurant" ;;
            coffee) slug="Coffee" ;;
            warehouse) slug="Warehouse" ;;
            clinic) slug="Clinic" ;;
            vet) slug="VetClinic" ;;
            pharmacy) slug="Pharmacy" ;;
            gym) slug="Gym" ;;
            *) slug="${module^}" ;;
          esac
          source="$(ls -t dist/*.AppImage | head -n1)"
          test -n "$source"
          target="dist/BizFlow-${slug}-linux.AppImage"
          cp "$source" "$target"
          echo "ASSET_PATH=$target" >> "$GITHUB_ENV"

      - name: Publish Linux asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: downloads-latest
          name: BizFlow Downloads
          prerelease: false
          make_latest: true
          files: |
            apps/Bizflow/${{ env.ASSET_PATH }}