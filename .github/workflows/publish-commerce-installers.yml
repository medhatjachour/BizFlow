name: Publish Desktop Installers

on:
  push:
    branches:
      - main
    paths:
      - "apps/Bizflow/**"
      - ".github/workflows/publish-commerce-installers.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-desktop-installers
  # Every push to main used to cancel the run in flight. Because the mac matrix
  # builds ten modules one at a time (max-parallel: 1) and waits on windows
  # first, the run never survived long enough to finish - which is why the
  # history is mostly cancelled. Queue instead of cancelling.
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        module:
          - suite
          - commerce
          - bakery
          - restaurant
          - coffee
          - warehouse
          - clinic
          - vet
          - pharmacy
          - gym
    defaults:
      run:
        working-directory: apps/Bizflow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/Bizflow/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build app (commerce)
        run: npm run build
        env:
          ENABLED_MODULES: ${{ matrix.module }}

      - name: Package Windows installer
        run: npx cross-env ENABLED_MODULES=${{ matrix.module }} CSC_IDENTITY_AUTO_DISCOVERY=false electron-builder --win --x64 --publish never

      - name: Prepare release asset name
        shell: pwsh
        run: |
          $module = "${{ matrix.module }}"
          $slug = switch ($module) {
            "suite" { "Suite" }
            "commerce" { "Commerce" }
            "bakery" { "Bakery" }
            "restaurant" { "Restaurant" }
            "coffee" { "Coffee" }
            "warehouse" { "Warehouse" }
            "clinic" { "Clinic" }
            "vet" { "VetClinic" }
            "pharmacy" { "Pharmacy" }
            "gym" { "Gym" }
            default { (Get-Culture).TextInfo.ToTitleCase($module) }
          }
          $source = Get-ChildItem dist -Filter *.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $source) { throw "No .exe installer found in dist" }
          $target = "dist/BizFlow-$slug-windows.exe"
          Copy-Item $source.FullName $target -Force
          "ASSET_PATH=$target" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish Windows asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: downloads-latest
          name: BizFlow Downloads
          prerelease: false
          make_latest: true
          files: |
            apps/Bizflow/${{ env.ASSET_PATH }}

  mac:
    runs-on: macos-latest
    needs: windows
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        module:
          - suite
          - commerce
          - bakery
          - restaurant
          - coffee
          - warehouse
          - clinic
          - vet
          - pharmacy
          - gym
    defaults:
      run:
        working-directory: apps/Bizflow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/Bizflow/package-lock.json

      # The macOS jobs cannot get past npm ci here: it reports every dependency
      # as missing from a lock file that provably contains them.
      #
      # The previous "fix" made things worse, and the log from run 34785576758
      # shows exactly how: falling back to `npm install` re-hoisted dependencies
      # into the repo ROOT, where the website's Tailwind 4 shadows this app's
      # Tailwind 3. The renderer then died on:
      #
      #   [postcss] Cannot find module 'tailwindcss/plugin'
      #   Require stack: /Users/runner/work/BizFlow/BizFlow/node_modules/tailwindcss-animate/index.js
      #
      # Note the path: node_modules at the repo root, not apps/Bizflow. So the
      # fallback is gone. Instead: install from this app's own lock file with
      # workspace resolution switched off, then prove the layout is right before
      # handing it to the build, so a bad install fails here with a reason
      # rather than three minutes later in the CSS pipeline.
      - name: Install dependencies
        shell: bash
        working-directory: apps/Bizflow
        run: |
          echo "cwd          = $(pwd)"
          echo "node         = $(node --version)   npm = $(npm --version)"
          echo "platform     = $(uname -s) $(uname -m)"
          echo "workspaces   = $(npm config get workspaces)"
          echo "lock file    = $(wc -c < package-lock.json) bytes, md5 $(md5 -q package-lock.json 2>/dev/null || md5sum package-lock.json | cut -d' ' -f1)"
          echo "lock entries = $(node -e 'const l=require("./package-lock.json"); console.log(Object.keys(l.packages||{}).length)')"
          df -h . | tail -n 1

          npm ci --ignore-scripts --no-audit --no-fund --workspaces=false

          echo "tailwind before check: $(node -e 'try{console.log(require.resolve("tailwindcss/package.json"))}catch(e){console.log("unresolved")}' 2>/dev/null || echo unresolved)"

          if [ ! -f node_modules/tailwindcss/plugin.js ]; then
            echo "::error::tailwindcss 3 did not install locally for apps/Bizflow."
            echo "node_modules/tailwindcss was expected at $(pwd)/node_modules/tailwindcss."
            ls -d node_modules/tailwindcss 2>/dev/null || echo "  (no node_modules/tailwindcss at all)"
            echo "Resolved tailwindcss/package.json: $(node -e 'try{console.log(require.resolve("tailwindcss/package.json"))}catch(e){console.log("unresolved")}' 2>/dev/null || echo unresolved)"
            echo "This usually means the install hoisted into the repo root, where the website's Tailwind 4 shadows this app's Tailwind 3."
            exit 1
          fi

          echo "tailwindcss $(node -e 'console.log(JSON.parse(require("fs").readFileSync("node_modules/tailwindcss/package.json","utf8")).version)') installed locally - layout looks right"

      - name: Build app (commerce)
        run: npm run build
        env:
          ENABLED_MODULES: ${{ matrix.module }}

      - name: Package macOS DMG
        run: npx cross-env ENABLED_MODULES=${{ matrix.module }} electron-builder --mac dmg --publish never

      - name: Prepare release asset name
        run: |
          module="${{ matrix.module }}"
          case "$module" in
            suite) slug="Suite" ;;
            commerce) slug="Commerce" ;;
            bakery) slug="Bakery" ;;
            restaurant) slug="Restaurant" ;;
            coffee) slug="Coffee" ;;
            warehouse) slug="Warehouse" ;;
            clinic) slug="Clinic" ;;
            vet) slug="VetClinic" ;;
            pharmacy) slug="Pharmacy" ;;
            gym) slug="Gym" ;;
            *) slug="${module^}" ;;
          esac
          source="$(ls -t dist/*.dmg | head -n1)"
          test -n "$source"
          target="dist/BizFlow-${slug}-mac.dmg"
          cp "$source" "$target"
          echo "ASSET_PATH=$target" >> "$GITHUB_ENV"

      - name: Publish macOS asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: downloads-latest
          name: BizFlow Downloads
          prerelease: false
          make_latest: true
          files: |
            apps/Bizflow/${{ env.ASSET_PATH }}

  linux:
    runs-on: ubuntu-latest
    needs: mac
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        module:
          - suite
          - commerce
          - bakery
          - restaurant
          - coffee
          - warehouse
          - clinic
          - vet
          - pharmacy
          - gym
    defaults:
      run:
        working-directory: apps/Bizflow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/Bizflow/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build app (commerce)
        run: npm run build
        env:
          ENABLED_MODULES: ${{ matrix.module }}

      - name: Package Linux AppImage
        run: npx cross-env ENABLED_MODULES=${{ matrix.module }} electron-builder --linux AppImage --publish never

      - name: Prepare release asset name
        run: |
          module="${{ matrix.module }}"
          case "$module" in
            suite) slug="Suite" ;;
            commerce) slug="Commerce" ;;
            bakery) slug="Bakery" ;;
            restaurant) slug="Restaurant" ;;
            coffee) slug="Coffee" ;;
            warehouse) slug="Warehouse" ;;
            clinic) slug="Clinic" ;;
            vet) slug="VetClinic" ;;
            pharmacy) slug="Pharmacy" ;;
            gym) slug="Gym" ;;
            *) slug="${module^}" ;;
          esac
          source="$(ls -t dist/*.AppImage | head -n1)"
          test -n "$source"
          target="dist/BizFlow-${slug}-linux.AppImage"
          cp "$source" "$target"
          echo "ASSET_PATH=$target" >> "$GITHUB_ENV"

      - name: Publish Linux asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: downloads-latest
          name: BizFlow Downloads
          prerelease: false
          make_latest: true
          files: |
            apps/Bizflow/${{ env.ASSET_PATH }}