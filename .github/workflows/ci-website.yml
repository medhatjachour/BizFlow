name: CI · Website

# `ci.yml` only watches `apps/Bizflow/**`, so a change to the marketing site and
# its 20-odd API routes was verified by nothing at push time: the first check it
# met was the Docker build inside `deploy.yml`, and a broken unit test would
# still ship. The website now owns licences, activation, support tickets and the
# live demo, so it gets its own gate.
#
# The suite runs against a scratch SQLite file created below rather than the
# repository's local database: several suites call `deleteMany()` on the tables
# they own, and pointing them at a developer's dev.db would wipe it. The tests
# carry their own LICENSE_SECRET / ADMIN_PASSWORD in `vitest.config.mts`, but the
# production build reads the real ones at import time and fails loudly without
# them, which is why dummy values are set here.

on:
  pull_request:
    paths:
      - "apps/website/**"
      - ".github/workflows/ci-website.yml"
  push:
    branches:
      - main
    paths:
      - "apps/website/**"
      - ".github/workflows/ci-website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/website
    env:
      # Relative sqlite paths resolve against the schema's directory, so this
      # lands on apps/website/prisma/ci.db — which `*.db` already gitignores.
      WEBSITE_DATABASE_URL: "file:./ci.db"
      LICENSE_SECRET: "ci-not-a-real-secret"
      ADMIN_PASSWORD: "ci-not-a-real-password"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      - name: Install dependencies
        # Matches deploy.yml. `vitest@5` wants `@types/node@^22 || >=24` while the
        # site is on Node 20 types, and a clean `npm ci` refuses to resolve that
        # peer conflict. `--legacy-peer-deps` here means CI installs exactly what
        # the deploy installs, so the two cannot disagree about the tree.
        run: npm ci --workspaces=false --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Prepare scratch database
        run: npx prisma db push --schema=prisma/schema.prisma --skip-generate --accept-data-loss

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
