name: Publish Commerce Windows Installer

on:
  push:
    branches:
      - main
    paths:
      - "apps/Bizflow/**"
      - ".github/workflows/publish-commerce-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/Bizflow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/Bizflow/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build app (commerce)
        run: npm run build:commerce

      - name: Package Windows installer
        run: npx cross-env ENABLED_MODULES=commerce electron-builder --win --x64

      - name: Normalize release asset name
        shell: pwsh
        run: |
          $source = Get-ChildItem dist -Filter *.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $source) { throw "No .exe installer found in dist" }
          Copy-Item $source.FullName dist/BizFlow-Commerce-windows.exe -Force

      - name: Publish asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: downloads-latest
          name: BizFlow Downloads
          prerelease: false
          make_latest: true
          files: apps/Bizflow/dist/BizFlow-Commerce-windows.exe