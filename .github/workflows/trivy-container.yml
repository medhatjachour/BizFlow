name: Scan Production Container

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-compose.yml
      - apps/website/**
      - apps/Bizflow/**
      - .github/workflows/trivy-container.yml
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag bizflow:scan .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bizflow:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # 1 = fail the build. This was 0, so the scanner could never fail a
          # build no matter what it found.
          exit-code: 1

      - name: Upload Trivy report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif