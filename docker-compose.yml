services:
  # Next.js website + HTTP bridge + Web BizFlow UI
  bizflow-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: /bizflow
        NEXT_PUBLIC_SITE_URL: https://medhatjachour.tech/bizflow
        ADMIN_PASSWORD: build-validation-only
    container_name: bizflow-app
    ports:
      - "3000:3000"    # Nebula website
      - "5180:5180"    # BizFlow web UI
      - "8787:8787"    # HTTP bridge (IPC handlers)
    volumes:
      # Persistent database volume
      - bizflow-data:/data/bizflow
      # Development mode: mount source for hot reload (optional)
      # - ./apps/bizflow:/app/apps/bizflow
      # - ./apps/nebula:/app/apps/nebula
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/bizflow/database.db
      BIZFLOW_DATA_DIR: /data/bizflow
      BRIDGE_PORT: 8787
      NEXT_PUBLIC_BASE_PATH: /bizflow
      NEXT_PUBLIC_SITE_URL: https://medhatjachour.tech/bizflow
      NEXTAUTH_URL: https://medhatjachour.tech/bizflow
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      REQUEST_MAIL_TO: medhatjachour8@gmail.com
      REQUEST_MAIL_FROM: ${REQUEST_MAIL_FROM:-medhatjachour8@gmail.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      REQUEST_MAIL_FALLBACK_DIRECT: ${REQUEST_MAIL_FALLBACK_DIRECT:-true}
      REQUEST_MAIL_HELO_NAME: ${REQUEST_MAIL_HELO_NAME:-medhatjachour.tech}
      REQUEST_MAIL_FALLBACK_HOST: ${REQUEST_MAIL_FALLBACK_HOST:-gmail-smtp-in.l.google.com}
      REQUEST_MAIL_FALLBACK_PORT: ${REQUEST_MAIL_FALLBACK_PORT:-25}
      # Add other env vars as needed
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/bizflow"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - bizflow-network

  # Optional: Nginx reverse proxy for single port access
  nginx:
    image: nginx:alpine
    container_name: bizflow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - bizflow-app
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - bizflow-network

  dozzle:
    image: amir20/dozzle:latest
    container_name: bizflow-dozzle
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bizflow-data:
    driver: local

networks:
  bizflow-network:
    driver: bridge
